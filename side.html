<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PG XC-kalender</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: kalenderliste gruppert per måned, med fast filterlinje øverst – som et oppslagsverk man skanner. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d9dfe6;
  --accent:#e0a100; --accent-ink:#5a4100; --accent-soft:#fff3cf;
  --cat1:#7a2f8f; --cat1-soft:#f3e6f7; --cat2:#1f5fa8; --cat2-soft:#e3eefa; --nocat:#5b6876; --nocat-soft:#eceff3;
  --new:#1c7a4a; --new-soft:#dff3e8; --star:#e0a100; --full:#a3341f; --full-soft:#fbe4de;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#16202a; --ink:#e6ecf2; --muted:#93a1b0; --line:#26323e;
  --accent:#f0b733; --accent-ink:#ffe39a; --accent-soft:#3a2f12;
  --cat1:#d9a3ea; --cat1-soft:#33203b; --cat2:#8dbbf0; --cat2-soft:#172a40; --nocat:#a3afbc; --nocat-soft:#222d38;
  --new:#6fd5a0; --new-soft:#143327; --star:#f0b733; --full:#f2a08e; --full-soft:#3d1d17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#16202a; --ink:#e6ecf2; --muted:#93a1b0; --line:#26323e;
  --accent:#f0b733; --accent-ink:#ffe39a; --accent-soft:#3a2f12;
  --cat1:#d9a3ea; --cat1-soft:#33203b; --cat2:#8dbbf0; --cat2-soft:#172a40; --nocat:#a3afbc; --nocat-soft:#222d38;
  --new:#6fd5a0; --new-soft:#143327; --star:#f0b733; --full:#f2a08e; --full-soft:#3d1d17; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

header{padding-block:28px 14px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(34px,7vw,52px)/1 var(--display);letter-spacing:.01em;margin:8px 0 10px;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--accent)}
.sum{color:var(--muted);margin:0;font-size:14px}
.sum b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:0 12px;font:inherit}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font:500 11px var(--mono);opacity:.7}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.reset{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:0 4px;flex:none}

main{padding-block:8px 48px}
.month{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.month h2{font:600 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0}
.month .c{font:500 12px var(--mono);color:var(--muted)}
.month::after{content:"";flex:1;height:1px;background:var(--line)}

.list{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px}
.ev.fav{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.date{text-align:center;padding-top:2px}
.date .d{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.date .r{font:500 11px/1.2 var(--mono);color:var(--muted);margin-top:4px;text-transform:lowercase}
.body{min-width:0}
.name{font-weight:600;font-size:15.5px;line-height:1.3;margin:0;overflow-wrap:anywhere}
.place{color:var(--muted);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{font:500 11.5px/1 var(--mono);padding:5px 7px;border-radius:6px;background:var(--nocat-soft);color:var(--nocat);white-space:nowrap}
.tag.c1{background:var(--cat1-soft);color:var(--cat1)}
.tag.c2{background:var(--cat2-soft);color:var(--cat2)}
.tag.new{background:var(--new-soft);color:var(--new)}
.tag.soon{background:var(--accent-soft);color:var(--accent-ink)}
.tag.full{background:var(--full-soft);color:var(--full)}
.tag.open{background:var(--new-soft);color:var(--new);font-weight:600}
.tag.wait{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.src{font:500 12px var(--mono);color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
.src:hover{color:var(--ink);border-color:var(--ink)}
.star{width:36px;height:36px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.star svg{width:20px;height:20px}
.star[aria-pressed="true"]{color:var(--star)}
.star[aria-pressed="true"] path{fill:currentColor}

.empty{padding:40px 16px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12.5px;padding-block:0 32px}
footer .wrap{border-top:1px solid var(--line);padding-top:14px}

@media (max-width:480px){
  .ev{grid-template-columns:48px 1fr auto;gap:10px;padding:10px}
  .date .d{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.ev{transition:border-color .15s}}
</style>
</head>
<body>
<header class="wrap">
  <div class="eyebrow">CIVL + Airtribune · paragliding XC</div>
  <h1>PG XC-<span>kalender</span></h1>
  <p class="sum" id="sum"></p>
</header>

<div class="bar">
  <div class="wrap">
    <div class="search">
      <input id="q" type="search" placeholder="Søk navn, sted eller land" autocomplete="off" aria-label="Søk">
    </div>
    <div class="chips" id="chips-region" role="group" aria-label="Region"></div>
    <div class="chips" id="chips-other" role="group" aria-label="Kategori og kilde"></div>
  </div>
</div>

<main class="wrap" id="main"></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
const INLINE = /*__DATA__*/null;
const MND = ["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];
const MK = ["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];
const REGIONER = ["Europa","Nord-Amerika","Sør-Amerika","Asia","Oseania","Afrika"];
const KAT = ["Cat 1","Cat 2","Ikke sanksjonert"];
const store = {
  get(k,d){try{const v=localStorage.getItem("pgxc:"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("pgxc:"+k,JSON.stringify(v))}catch(e){}}
};
const st = Object.assign({q:"",region:[],kat:[],kilde:[],pam:[],fav:false}, store.get("filter",{}));
if(!Array.isArray(st.pam)) st.pam=[];
const PAM = ["Påmelding åpnet nylig","Ledige plasser","Venteliste","Ingen påmeldt ennå"];
function pamStatus(e){
  const n=e.pameldt, m=e.maks;
  if(n==null) return "";
  if(n===0) return "Ingen påmeldt ennå";
  if(m && n>=m) return "Venteliste";
  return "Ledige plasser";
}
function nyligApnet(e){ return e.apnet && (Date.now()-new Date(e.apnet))/864e5 < 7; }
let favs = new Set(store.get("favs",[]));
let ALL = [];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const d = s => { if(!s) return null; const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); };
const today = (()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())})();
const key = e => (e.kilder[0]?.url)||e.navn;

function range(e){
  const a=d(e.start), b=d(e.slutt);
  if(!a) return {top:"?", sub:""};
  if(!b || +a===+b) return {top:String(a.getDate()), sub:MK[a.getMonth()]};
  if(a.getMonth()===b.getMonth()) return {top:`${a.getDate()}–${b.getDate()}`, sub:MK[a.getMonth()]};
  return {top:`${a.getDate()}.`, sub:`${MK[a.getMonth()]}–${b.getDate()}. ${MK[b.getMonth()]}`};
}
function rel(e){
  const a=d(e.start), b=d(e.slutt)||a; if(!a) return null;
  const n=Math.round((a-today)/864e5);
  if(n<=0 && b>=today) return {t:"pågår nå",c:"soon"};
  if(n===1) return {t:"i morgen",c:"soon"};
  if(n<=30) return {t:`om ${n} dager`,c:"soon"};
  if(n<=90) return {t:`om ${Math.round(n/7)} uker`,c:""};
  return null;
}
let FIRST = 0; // tidspunktet for første innlesing – det som fantes da regnes ikke som nytt
function isNew(e){
  if(!e.funnet) return false;
  const f = +new Date(e.funnet);
  return f - FIRST > 864e5 && (Date.now()-f)/864e5 < 7;
}

function matches(e){
  if(st.fav && !favs.has(key(e))) return false;
  if(st.region.length && !st.region.includes(e.region)) return false;
  if(st.kat.length && !st.kat.includes(e.kategori||"Ukjent")) return false;
  if(st.kilde.length && !e.kilder.some(k=>st.kilde.includes(k.kilde))) return false;
  if(st.pam.length && !st.pam.some(p=> p==="Påmelding åpnet nylig" ? nyligApnet(e) : pamStatus(e)===p)) return false;
  if(st.q){
    const hay=(e.navn+" "+e.sted+" "+e.landnavn+" "+e.land).toLowerCase();
    if(!st.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) return false;
  }
  return true;
}

function chip(group,val,label,count){
  const on = group==="fav" ? st.fav : st[group].includes(val);
  return `<button class="chip" data-g="${group}" data-v="${esc(val)}" aria-pressed="${on}">${esc(label)}${count!=null?` <span class="n">${count}</span>`:""}</button>`;
}
function renderChips(){
  const cnt=(f)=>ALL.filter(f).length;
  $("#chips-region").innerHTML =
    REGIONER.filter(r=>ALL.some(e=>e.region===r)).map(r=>chip("region",r,r,cnt(e=>e.region===r))).join("");
  const any = st.q||st.region.length||st.kat.length||st.kilde.length||st.pam.length||st.fav;
  $("#chips-other").innerHTML =
    chip("fav","","★ Mine",favs.size) + `<span class="sep"></span>` +
    KAT.filter(k=>ALL.some(e=>e.kategori===k)).map(k=>chip("kat",k,k,cnt(e=>e.kategori===k))).join("") +
    `<span class="sep"></span>` +
    ["CIVL","Airtribune"].map(s=>chip("kilde",s,s,cnt(e=>e.kilder.some(k=>k.kilde===s)))).join("") +
    `<span class="sep"></span>` +
    PAM.map(p=>[p, p==="Påmelding åpnet nylig"?cnt(nyligApnet):cnt(e=>pamStatus(e)===p)]).filter(([p,n])=>n>0)
       .map(([p,n])=>chip("pam",p,p,n)).join("") +
    (any?`<button class="reset" id="reset">Nullstill</button>`:"");
}

function regTag(e){
  const n=e.pameldt, m=e.maks, s=pamStatus(e);
  if(!s) return "";
  if(s==="Ingen påmeldt ennå") return `<span class="tag wait" title="Påmeldingen har trolig ikke åpnet">ingen påmeldt ennå${m?` · ${m} plasser`:""}</span>`;
  if(s==="Venteliste") return `<span class="tag full" title="Flere påmeldt enn plasser">venteliste · ${n}/${m}</span>`;
  return `<span class="tag">${m?`${n}/${m}`:n} påmeldt</span>`;
}
const STAR = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

function renderList(){
  const vis = ALL.filter(matches);
  const groups = new Map();
  for(const e of vis){
    const a=d(e.start); const k=a?`${a.getFullYear()}-${a.getMonth()}`:"ukjent";
    if(!groups.has(k)) groups.set(k,{label:a?`${MND[a.getMonth()]} ${a.getFullYear()}`:"Dato ikke oppgitt",items:[]});
    groups.get(k).items.push(e);
  }
  let html="";
  for(const g of groups.values()){
    html += `<section><div class="month"><h2>${esc(g.label)}</h2><span class="c">${g.items.length}</span></div><div class="list">`;
    for(const e of g.items){
      const r=range(e), rl=rel(e), k=key(e), fav=favs.has(k);
      const katCls = e.kategori==="Cat 1"?"c1":e.kategori==="Cat 2"?"c2":"";
      const tags = [
        isNew(e)?`<span class="tag new">ny</span>`:"",
        rl?`<span class="tag ${rl.c}">${rl.t}</span>`:"",
        e.kategori?`<span class="tag ${katCls}">${esc(e.kategori==="Ikke sanksjonert"?"ikke sanksj.":e.kategori)}</span>`:"",
        nyligApnet(e)?`<span class="tag open">påmelding åpnet</span>`:"",
        regTag(e),
      ].join("");
      const src = e.kilder.map(s=>`<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.kilde)} ↗</a>`).join("");
      html += `<article class="ev${fav?" fav":""}">
        <div class="date"><div class="d">${esc(r.top)}</div><div class="r">${esc(r.sub)}</div></div>
        <div class="body">
          <h3 class="name">${esc(e.navn)}</h3>
          <div class="place">${esc([e.sted,e.landnavn].filter(Boolean).join(", "))}</div>
          <div class="meta">${tags}${src}</div>
        </div>
        <button class="star" data-k="${esc(k)}" aria-pressed="${fav}" aria-label="${fav?"Fjern fra mine":"Legg til i mine"}">${STAR}</button>
      </article>`;
    }
    html += `</div></section>`;
  }
  $("#main").innerHTML = html || `<div class="empty">Ingen konkurranser passer filteret.<br><button class="reset" id="reset2">Vis alle</button></div>`;
  const ny = ALL.filter(isNew).length;
  $("#sum").innerHTML = `<b>${vis.length}</b> av <b>${ALL.length}</b> kommende konkurranser` + (ny?` · <b>${ny}</b> nye siste uke`:"");
}

function render(){ renderChips(); renderList(); store.set("filter",st); }

document.addEventListener("click", ev=>{
  const c = ev.target.closest(".chip");
  if(c){ const g=c.dataset.g, v=c.dataset.v;
    if(g==="fav") st.fav=!st.fav; else { const a=st[g]; const i=a.indexOf(v); i<0?a.push(v):a.splice(i,1); }
    render(); return; }
  const s = ev.target.closest(".star");
  if(s){ const k=s.dataset.k; favs.has(k)?favs.delete(k):favs.add(k); store.set("favs",[...favs]); render(); return; }
  if(ev.target.id==="reset"||ev.target.id==="reset2"){ Object.assign(st,{q:"",region:[],kat:[],kilde:[],pam:[],fav:false}); $("#q").value=""; render(); }
});
$("#q").addEventListener("input", e=>{ st.q=e.target.value.trim(); renderList(); renderChips(); store.set("filter",st); });

async function boot(){
  let data = INLINE;
  if(!data){ try{ data = await fetch("konkurranser.json").then(r=>r.json()); }catch(e){ data = {konkurranser:[]}; } }
  ALL = (data.konkurranser||[]).filter(e=>!e.slutt || d(e.slutt)>=today);
  FIRST = data.startet ? +new Date(data.startet) : Math.min(...ALL.map(e=>+new Date(e.funnet||Date.now())));
  $("#q").value = st.q;
  const t = data.oppdatert ? new Date(data.oppdatert) : null;
  $("#foot").innerHTML = `Oppdateres automatisk hver tredje time${t?` · sist ${t.toLocaleString("no-NO",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}`:""}. Stjernemerkede konkurranser lagres bare i denne nettleseren.`;
  render();
}
boot();
</script>
</body>
</html>
