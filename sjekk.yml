name: Sjekk nye konkurranser

on:
  schedule:
    - cron: "17 */3 * * *"   # hver 3. time
  workflow_dispatch:          # gjør at du kan kjøre den manuelt med en knapp

permissions:
  contents: write

jobs:
  sjekk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Kjør overvåking
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py
      - name: Lagre hva som er sett
        run: |
          git config user.name "konkurransevarsel"
          git config user.email "actions@users.noreply.github.com"
          git add sett.json docs/index.html
          git diff --cached --quiet || git commit -m "Oppdater konkurranseliste"
          git push
